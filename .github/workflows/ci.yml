name: Verify

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test frontend library, filters, and playlists
        run: node --test tests/core.test.cjs
      - name: Test local collector, pagination and HTTP security
        run: python -m unittest discover -s tests -p 'test_collector.py' -v
      - name: Compile and check JavaScript syntax
        run: |
          python -m py_compile collector.py
          node --check app.js
          node --check core.js
          node --check connect.js